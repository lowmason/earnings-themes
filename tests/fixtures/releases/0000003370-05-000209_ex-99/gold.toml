start = "Total revenue from continuing operations for fiscal year 2005 was"
end = "Foreign currency translation had a positive impact on total revenue of 0.8%."

[[blocks]]
id = "b013"
type = "heading"
level = 2
start = "Fourth Quarter 2005 Financial Details"

[[blocks]]
id = "b014"
type = "paragraph"
start = "Net Sales of $516 million, which includes the sale of"
end = "a continuation of aggressive promotions initiated during the second quarter of fiscal year 2005."

[[blocks]]
id = "b015"
type = "paragraph"
start = "Services revenue of $564 million, which includes Customer Services revenue"
end = "the second quarter of fiscal year 2005 and a continued focus on cost and expense reductions."

[[blocks]]
id = "b016"
type = "paragraph"
start = "Finance Income, derived from the retained U.S. leasing portfolio and"
end = "the retained U.S. portfolio is expected to run off by the middle of fiscal year 2007."

[[blocks]]
id = "b017"
type = "paragraph"
start = "Selling and Administrative Expenses declined 2% to $358 million in"
end = "represented 31.1% of revenue compared with 31.9% in the same quarter last year."

[[blocks]]
id = "b018"
type = "paragraph"
start = "Operating Income was $39 million in the fourth quarter of"
end = "as well as its 50 other locations across Europe."

[[blocks]]
id = "b019"
type = "heading"
level = 2
start = "Balance Sheet and Liquidity"

[[blocks]]
id = "b020"
type = "paragraph"
start = "Unrestricted cash was $374 million as of September 30, 2005,"
end = "decreased to 44% as of September 30, 2005, from 50%, as of September 30, 2004."

[[blocks]]
id = "b021"
type = "paragraph"
start = "In September 2005, IKON issued $225 million of 7.75% Senior"
end = "with the call notice issued on September 21, 2005."

[[blocks]]
id = "b022"
type = "paragraph"
start = "Consistent with its strategy, the Company purchased 5.3 million shares"
end = "leaving $86 million remaining under the Company’s 2004 Board authorization."

[[blocks]]
id = "b023"
type = "paragraph"
start = "IKON’s Board of Directors approved the Company’s regular quarterly cash"
end = "holders of record at the close of business on November 21, 2005."

[[blocks]]
id = "b024"
type = "heading"
level = 2
start = "Outlook"

[[blocks]]
id = "b025"
type = "paragraph"
start = "“Fiscal year 2005 was a year in which we made"
end = "continued to buy back shares and improved our debt to capital ratio.”"

[[blocks]]
id = "b026"
type = "paragraph"
start = "Espe continued, “The work completed in fiscal year 2005 positions"
end = "cash from continuing operations to be in the range of $50 million to $100 million.”"

[[blocks]]
id = "b027"
type = "paragraph"
start = "The Company also expects earnings per diluted share from continuing"
end = "range between $0.16 and $0.18, including the impact of expensing stock options."

[[blocks]]
id = "b028"
type = "heading"
level = 2
start = "About IKON"

[[blocks]]
id = "b029"
type = "paragraph"
start = "IKON Office Solutions, Inc. (www.ikon.com), the world’s largest independent channel"
end = "IKON has approximately 26,000 employees in 450 locations throughout North America and Western Europe."

[[blocks]]
