type = "paragraph"
start = "“Our performance during the quarter confirmed that we are headed"
end = "These are all positive trends that we expect to continue as we begin our new fiscal year.”"

[[blocks]]
id = "b008"
type = "paragraph"
start = "For the fourth quarter of fiscal year 2005, the Company"
end = "Professional Services from consulting, network connectivity services, document strategy assessments and software solutions."

[[blocks]]
id = "b009"
type = "paragraph"
start = "“Within IKON Enterprise Services, our U.S. on-site Managed Services business"
end = "including software, services and workflow solutions with the traditional equipment sale.”"

[[blocks]]
id = "b010"
type = "paragraph"
start = "For fiscal year 2005, net income from continuing operations was"
end = "consistent with the Company’s previously communicated expectations of $0.60 to $0.63."

[[blocks]]
id = "b011"
type = "paragraph"
start = "As previously disclosed, for fiscal year 2005 financial reporting, the Company"
end = "the Company files its Annual Report on Form 10-K in December."

[[blocks]]
id = "b012"
