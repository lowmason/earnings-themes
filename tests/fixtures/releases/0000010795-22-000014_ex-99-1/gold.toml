level = 1
start = "Completed the acquisitions of Scanwell Health Inc.,"
end = "expand from cancer discovery and diagnosis into post-treatment monitoring."

[[blocks]]
id = "b021"
type = "list_item"
level = 1
start = "Released its inaugural Global Inclusion, Diversity and Equity (ID&E) report, highlighting the progress BD is making toward its ESG strategy."

[[blocks]]
id = "b022"
type = "list_item"
level = 1
start = "Published its 2021 Cybersecurity Annual report, the only MedTech company to do so."

[[blocks]]
id = "b023"
type = "list_item"
level = 1
start = "Named One of America's Most Just Companies in the annual JUST 100 Ranking."

[[blocks]]
