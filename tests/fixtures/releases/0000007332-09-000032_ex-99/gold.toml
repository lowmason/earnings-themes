[[blocks]]
id = "b001"
type = "heading"
level = 1
start = "NEWS RELEASE"

[[blocks]]
id = "b002"
type = "heading"
level = 2
start = "SOUTHWESTERN ENERGY ANNOUNCES THIRD QUARTER 2009 RESULTS"
end = "AND UPDATES FOURTH QUARTER PRODUCTION GUIDANCE"

[[blocks]]
id = "b003"
type = "paragraph"
start = "Houston, Texas – October 29, 2009...Southwestern Energy Company"
end = "results for the third quarter of 2009. Highlights include:"

[[blocks]]
id = "b004"
type = "list_item"
level = 1
start = "Natural gas and crude oil production of 73.2 Bcfe"
end = "up 38% over the same period in 2008"

[[blocks]]
id = "b005"
type = "list_item"
level = 1
start = "Net cash provided by operating activities before changes in operating assets and liabilities of $331.8 million"
end = "up from $312.1 million in the same period in 2008"

[[blocks]]
id = "b006"
type = "list_item"
level = 1
start = "Net earnings of $118.3 million"
end = "compared to $218.2 million in the same period in 2008"

[[blocks]]
id = "b007"
type = "list_item"
level = 1
start = "Revised fourth quarter 2009 production guidance range to 86-89 Bcfe"
end = "up 12% from midpoints of previous guidance"

[[blocks]]
id = "b008"
type = "paragraph"
start = "For the third quarter of 2009, Southwestern reported net income"
end = "up from $312.1 million for the same period in 2008."

[[blocks]]
id = "b009"
type = "paragraph"
start = "“We had a solid quarter despite depressed natural gas prices"
end = "will create tremendous value for Southwestern Energy and its shareholders.”"

[[blocks]]
id = "p002"
type = "page_artifact"
start = "- MORE -"

[[blocks]]
id = "b010"
type = "heading"
level = 2
start = "Third Quarter 2009 Financial Results"

[[blocks]]
id = "b011"
type = "paragraph"
start = "E&P Segment - Operating income from the company’s E&P segment"
end = "partially offset by a 38% increase in production volumes."

[[blocks]]
id = "b012"
type = "paragraph"
start = "Gas and oil production totaled 73.2 Bcfe in the third quarter"
end = "was also placed back into service in October after this shut down."

[[blocks]]
id = "b013"
type = "paragraph"
start = "As a result of the repairs, the company is now able"
end = "Southwestern’s production guidance for the remainder of 2009 is shown below:"

[[blocks]]
id = "t001"
type = "table"
headers = [
  "1st Quarter",
  "2nd Quarter",
  "3rd Quarter",
  "4th Quarter",
  "Full-Year 2009",
  "Actual",
  "Actual",
  "Actual",
  "Estimate",
  "Estimate",
]
cells = [
  { role = "corner", text = "60 - 61", row_header = "Previous Guidance (Bcfe)", col_header = "1st Quarter Actual" },
  { role = "right", text = "70 - 71", row_header = "Previous Guidance (Bcfe)", col_header = "2nd Quarter Actual" },
  { role = "below", text = "63.9", row_header = "Revised Guidance (Bcfe)", col_header = "1st Quarter Actual" },
]

[[blocks]]
id = "b014"
type = "paragraph"
start = "Including the effect of hedges, Southwestern’s average realized gas price"
end = "at a weighted average floor price of $8.41 per Mcf."

[[blocks]]
id = "b015"
type = "paragraph"
start = "Disregarding the impact of commodity price hedges"
end = "and fuel charges which range from 0.25 to 2.25%."

[[blocks]]
id = "p003"
type = "page_artifact"
start = "- MORE -"

[[blocks]]
id = "b016"
type = "paragraph"
start = "Lease operating expenses per unit of production for the company’s E&P segment"
end = "on the cost of compressor fuel in the third quarter of 2009."

[[blocks]]
id = "b017"
type = "paragraph"
start = "General and administrative expenses per unit of production were $0.38 per Mcfe"
end = "partially offset by the effects of the company’s increased production volumes."

[[blocks]]
id = "b018"
type = "paragraph"
start = "Taxes other than income taxes per unit of production were $0.10 per Mcfe"
end = "that result from the mix of the company’s production volumes."

[[blocks]]
id = "b019"
type = "paragraph"
start = "The company’s full cost pool amortization rate decreased to $1.43 per Mcfe"
end = "the variability of each of the factors discussed above, as well as other factors."

[[blocks]]
id = "b020"
type = "paragraph"
start = "Midstream Services - Operating income for the company’s midstream services segment, which is comprised of natural gas gathering and marketing activities, was $25.1 million for the three months ended September 30, 2009"
end = "as reserves related to the company’s Fayetteville Shale play are developed and production increases."

[[blocks]]
id = "p004"
type = "page_artifact"
start = "- MORE -"

[[blocks]]
id = "b021"
type = "heading"
level = 2
start = "First Nine Months of 2009 Financial Results"

[[blocks]]
id = "b022"
type = "paragraph"
start = "For the first nine months of 2009, Southwestern reported a net loss"
end = "partially offset by significant growth in production volumes."

[[blocks]]
id = "b023"
type = "paragraph"
start = "Net cash provided by operating activities before changes in operating assets and liabilities (a non-GAAP measure; see reconciliation below), was $1.03 billion"
end = "up 16% from $884.1 million for the same period in 2008."

[[blocks]]
id = "b024"
type = "paragraph"
start = "E&P Segment - Excluding the non-cash ceiling test impairment"
end = "operating costs and expenses which were partially offset by higher production."

[[blocks]]
id = "b025"
type = "paragraph"
start = "Gas and oil production was 211.4 Bcfe in the first nine months of 2009"
end = "up from 90.4 Bcf in the first nine months of 2008."

[[blocks]]
id = "b026"
type = "paragraph"
start = "Southwestern’s average realized gas price was $5.31 per Mcf"
end = "compared to approximately $0.90 per Mcf lower than NYMEX spot prices during the first nine months of 2008."

[[blocks]]
id = "b027"
type = "paragraph"
start = "Lease operating expenses for the company’s E&P segment were $0.76 per Mcfe"
end = "on the cost of compressor fuel in the first nine months of 2009."

[[blocks]]
id = "b028"
type = "paragraph"
start = "General and administrative expenses were $0.34 per Mcfe in the first nine months of 2009"
end = "Southwestern added 227 new employees during the first nine months of 2009."

[[blocks]]
id = "p005"
type = "page_artifact"
start = "- MORE -"

[[blocks]]
id = "b029"
type = "paragraph"
start = "Taxes other than income taxes were $0.10 per Mcfe during the first nine months of 2009"
end = "due to lower commodity prices and the change in the mix of the company’s production volumes."

[[blocks]]
id = "b030"
type = "paragraph"
start = "The company’s full cost pool amortization rate decreased to $1.56 per Mcfe"
end = "as the proceeds were credited to the full cost pool."

[[blocks]]
id = "b031"
type = "paragraph"
start = "Midstream Services - Operating income for the company’s midstream activities was $80.3 million"
end = "increased gathering revenues and an increase in the margin from gas marketing activities related to the Fayetteville Shale play, partially offset by increased operating costs and expenses."

[[blocks]]
id = "b032"
type = "paragraph"
start = "Capital Investments - In the first nine months of 2009"
end = "its total capital investments for the full year of 2009 to be approximately $1.8 billion."

[[blocks]]
id = "b033"
type = "heading"
level = 2
start = "E&P Operations Review"

[[blocks]]
id = "b034"
type = "paragraph"
start = "Fayetteville Shale Play - For the first nine months of 2009"
end = "all of which were horizontal wells fracture stimulated using slickwater."

[[blocks]]
id = "b035"
type = "paragraph"
start = "At October 24, 2009, the company’s gross production rate"
end = "from the company’s operated wells in the Fayetteville Shale play area through October 24, 2009."

