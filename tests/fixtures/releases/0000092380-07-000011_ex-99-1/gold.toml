start = "SOUTHWEST AIRLINES REPORTS FIRST QUARTER EARNINGS;"
end = "64th CONSECUTIVE QUARTER OF PROFITABILITY"

[[blocks]]
id = "b004"
type = "paragraph"
start = "DALLAS, TEXAS - April 19, 2007 - Southwest Airlines"
end = "the accompanying tables for further information regarding economic results.)"

[[blocks]]
id = "b005"
type = "heading"
level = 2
start = "First Quarter 2007 Financial Highlights:"

[[blocks]]
id = "b006"
type = "list_item"
level = 1
start = "Record first quarter revenues of $2.2 billion, up 8.9 percent"

[[blocks]]
id = "b007"
type = "list_item"
level = 1
start = "Economic net income of $33 million, down 48.4 percent"

[[blocks]]
id = "b008"
type = "list_item"
level = 1
start = "Economic net income per diluted share of $.04, down 50 percent"

[[blocks]]
id = "b009"
type = "list_item"
level = 1
start = "Repurchased 13.5 million shares of common stock for $209 million"

[[blocks]]
id = "b010"
type = "paragraph"
start = "Gary C. Kelly, CEO, stated: “Although we are gratified"
end = "combined to cool the rate of growth in domestic air travel."

[[blocks]]
id = "b011"
type = "paragraph"
start = "“Last year’s second quarter revenue performance was exceptionally strong"
end = "from first to second quarter, however."

[[blocks]]
id = "p001"
type = "page_artifact"
start = "/more"

[[blocks]]
id = "b012"
type = "paragraph"
start = "“Despite $65 million in favorable cash settlements from derivative contracts"
end = "estimated fuel consumption for the second half of 2007 at an average crude-equivalent price of approximately $50 per barrel."

[[blocks]]
id = "b013"
type = "paragraph"
start = "“As expected, our first quarter 2007 unit costs, excluding fuel,"
end = "to be comparable to second quarter 2006’s 6.68 cents."

[[blocks]]
id = "b014"
type = "paragraph"
start = "“We continue efforts to improve productivity and enhance the overall travel experience"
end = "100 Best Corporate Citizens for the eighth year in a row."

[[blocks]]
id = "b015"
type = "paragraph"
start = '"With the lowest overall unit costs (adjusted for stage length),'
end = "we can achieve our longterm financial goals."

[[blocks]]
id = "b016"
type = "paragraph"
start = "“We continue to actively explore the secondary aircraft market for additional aircraft"
end = "to resume service to San Francisco International Airport this fall.”"

[[blocks]]
id = "b017"
type = "paragraph"
start = "Southwest will discuss its first quarter 2007 results on a conference call"
end = "available at southwest.com."

[[blocks]]
id = "p002"
type = "page_artifact"
start = "/more"

[[blocks]]
id = "b018"
type = "heading"
level = 2
start = "Operating Results"

[[blocks]]
id = "b019"
type = "paragraph"
start = "Total operating revenues for first quarter 2007 increased 8.9 percent"
end = "compared to $115 million last year."

[[blocks]]
id = "b020"
type = "paragraph"
start = "“Other income” was $65 million for first quarter 2007"
end = 'is also included in "other (gains) losses."'

[[blocks]]
id = "b021"
type = "paragraph"
start = "Net cash provided by operations for first quarter 2007 was $617 million"
end = "under this latest authorization."

[[blocks]]
id = "b022"
type = "paragraph"
start = "The Company ended first quarter 2007 with $1.9 billion in cash and short-term investments"
end = "approximately $113 million in debt in the remainder of 2007."

[[blocks]]
id = "b023"
type = "paragraph"
start = "This news release contains forward-looking statements as defined"
end = "after the date of this press release."

