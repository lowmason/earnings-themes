[[claims]]
claim_id = "c1"
quote_ids = ["q1"]
claim = "Revenue for the quarter came to about 13.3 billion dollars."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q2"]
claim = "Intel lost money per share in the quarter on both the GAAP and the non-GAAP basis."
origin = "drafted_accepted"

[[claims]]
claim_id = "c3"
quote_ids = ["q3", "q4"]
claim = "Restructuring costs, asset write-downs, faster depreciation and a tax-asset reserve together took 3.89 dollars off GAAP per-share results."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q5", "q6"]
claim = "Write-downs and quicker depreciation of factory assets lowered per-share results on both bases, by 57 and 63 cents."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q7", "q8"]
claim = "Intel moved ahead on a program meant to take 10 billion dollars out of its cost base in 2025."
origin = "drafted_accepted"

[[claims]]
claim_id = "c6"
quote_ids = ["q9"]
claim = "For the next quarter, management guided revenue to a 13.3-14.3 billion dollar range, with a small GAAP loss but a non-GAAP profit per share."
origin = "drafted_accepted"

[[claims]]
claim_id = "c7"
quote_ids = ["q10"]
claim = "The CEO tied the quarter to a plan, set out a quarter earlier, to lower costs, streamline the business and run the organization more efficiently."
origin = "drafted_accepted"

[[claims]]
claim_id = "c8"
quote_ids = ["q11"]
claim = "Quarterly revenue landed above the middle of the range Intel had forecast."
origin = "drafted_accepted"

[[claims]]
claim_id = "c9"
quote_ids = ["q12"]
claim = "Outside chip designers are showing strong interest in Intel's 18A manufacturing process."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q13"]
claim = "Management sees growing momentum across its product line built on the x86 architecture."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q14"]
claim = "The CFO expects this quarter's steps to lift profitability and strengthen the cash position."
origin = "drafted_accepted"

[[claims]]
claim_id = "c12"
quote_ids = ["q15"]
claim = "Restructuring costs weighed heavily on the quarter's profit."
origin = "drafted_accepted"

[[claims]]
claim_id = "c13"
quote_ids = ["q16"]
claim = "Management says better underlying business trends are built into its fourth-quarter forecast."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q17"]
claim = "Operating activities brought in 4.1 billion dollars of cash in the quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c15"
quote_ids = ["q18"]
claim = "Intel paid out half a billion dollars in dividends during the quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q19"]
claim = "The cost program is meant to make operations leaner and free up money for continued investment in technology and factories."
origin = "drafted_accepted"

[[claims]]
claim_id = "c17"
quote_ids = ["q20"]
claim = "The program reorganizes the company and cuts jobs, operating spending and capital spending."
origin = "drafted_accepted"

[[claims]]
claim_id = "c18"
quote_ids = ["q21"]
claim = "The quarter carried 2.8 billion dollars of restructuring charges, most of them to be paid in cash later."
origin = "drafted_accepted"

[[claims]]
claim_id = "c19"
quote_ids = ["q22"]
claim = "Intel booked 3.1 billion dollars, mostly in cost of sales, to write down and depreciate factory assets faster, chiefly for Intel 7, after weighing capacity against expected demand."
origin = "drafted_accepted"

[[claims]]
claim_id = "c20"
quote_ids = ["q23", "q24", "q25"]
claim = "Intel recorded a combined $2.9 billion in noncash charges for goodwill and acquired intangibles, with Mobileye the main reporting unit affected."
origin = "drafted_edited"

[[claims]]
claim_id = "c21"
quote_ids = ["q26"]
claim = "A 9.9 billion dollar charge set up a reserve against US deferred tax assets."
