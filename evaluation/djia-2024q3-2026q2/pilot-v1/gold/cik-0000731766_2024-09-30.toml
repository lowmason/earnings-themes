[[claims]]
claim_id = "c1"
quote_ids = ["q1", "q10"]
claim = "Quarterly revenue rose about $8.5 billion from a year earlier, to $100.8 billion, mainly because more people were served across both businesses."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q5"]
claim = "Both segments added people served, and management calls the growth wide-ranging."
origin = "drafted_accepted"

[[claims]]
claim_id = "c3"
quote_ids = ["q6"]
claim = "The CEO credits ongoing growth to the company's offerings and its staff's service, without naming a product."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q3", "q11"]
claim = "GAAP results for the quarter carry cyberattack harm, which took about $0.3 billion off operating earnings of $8.7 billion."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q4", "q12"]
claim = "Adjusted EPS was $7.15 after retaining a twelve-cent per-share business-disruption impact and excluding twenty-eight cents per share of direct cyberattack response costs."
origin = "drafted_edited"

[[claims]]
claim_id = "c6"
quote_ids = ["q7"]
claim = "Management forecasts annual GAAP EPS of $15.50 to $15.75, including the effects of the South American disposals and the cyberattack."
origin = "drafted_edited"

[[claims]]
claim_id = "c7"
quote_ids = ["q8"]
claim = "Adjusted EPS guidance for the year is $27.50 to $27.75, inside the band the company first gave roughly twelve months before."
origin = "drafted_accepted"

[[claims]]
claim_id = "c8"
quote_ids = ["q9"]
claim = "The adjusted guidance takes in about $0.75 a share of disruption losses at Change Healthcare, roughly ten cents more than the prior quarter's estimate."
origin = "drafted_accepted"

[[claims]]
claim_id = "c9"
quote_ids = ["q13"]
claim = "Medical costs took a larger share of premiums: the ratio climbed to 85.2% from 82.3% a year before."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q14"]
claim = "Lower Medicare funding from CMS is one cause the company gives for the higher medical care ratio."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q14"]
claim = "A shift in the blend of businesses and members also pushed the medical care ratio up."
origin = "drafted_accepted"

[[claims]]
claim_id = "c12"
quote_ids = ["q14", "q15"]
claim = "Reserve development worked against the ratio, and no favorable prior-period reserve release helped earnings this quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c13"
quote_ids = ["q16", "q17", "q18"]
claim = "Days claims payable rose to 47.4 from 45.2 a quarter earlier as providers resumed normal billing, but stayed under the year-ago 50.7 because claims are now paid faster."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q19"]
claim = "The operating cost ratio eased to 13.2%, below both the prior quarter and the year before, which the company puts down to efficiency."
origin = "drafted_accepted"

[[claims]]
claim_id = "c15"
quote_ids = ["q20"]
claim = "Operating cash flow in the quarter was $14.0 billion, more than twice net income, helped partly by when cash came in."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q21"]
claim = "Dividends and buybacks gave shareholders more than $9.6 billion over the year's first three quarters."
origin = "drafted_accepted"

[[claims]]
claim_id = "c17"
quote_ids = ["q22"]
claim = "The quarter produced a 26.3% return on equity, which management attributes to consistent earnings across the business and effective use of capital."
origin = "drafted_edited"

[[claims]]
claim_id = "c18"
quote_ids = ["q24"]
claim = "UnitedHealthcare revenue rose $5 billion from a year earlier, to $74.9 billion, on more domestic members."
origin = "drafted_accepted"

[[claims]]
claim_id = "c19"
quote_ids = ["q25"]
claim = "UnitedHealthcare earned $4.2 billion from operations in the quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c20"
quote_ids = ["q2", "q26"]
