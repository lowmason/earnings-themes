[[claims]]
claim_id = "c1"
quote_ids = ["q1", "q16"]
claim = "Sales for 2024 inched up to an all-time high of about $23.1 billion, as the stores segment's gains outran weakness elsewhere."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q2"]
claim = "For the full year, sales at stores open over a year in the stores segment rose 1.7%."
origin = "drafted_accepted"

[[claims]]
claim_id = "c3"
quote_ids = ["q3", "q4"]
claim = "Full-year EPS grew 14.1% on a GAAP basis to $10.55 and 9.5% on an adjusted basis to $11.33."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q5", "q12"]
claim = "In Q4, GAAP EPS jumped 36.7% to $1.90 and adjusted EPS 15.5% to $2.09; adjusted margins widened in every segment."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q6", "q37", "q17"]
claim = "Operating activities brought in $3.15 billion of cash in 2024, equal to 13.7% of sales."
origin = "drafted_accepted"

[[claims]]
claim_id = "c6"
quote_ids = ["q7"]
claim = "Adjusted EBITDA for 2024 was up 6.0% at $4.49 billion, a 19.4% margin on sales."
origin = "drafted_accepted"

[[claims]]
claim_id = "c7"
quote_ids = ["q8", "q9"]
claim = "The company guides 2025 GAAP EPS to $10.70-$11.10 and adjusted EPS to $11.65-$12.05; the gap is $0.80 of deal amortization plus $0.15 of restructuring cost."
origin = "drafted_accepted"

[[claims]]
claim_id = "c8"
quote_ids = ["q10"]
claim = "Most of the markets the company sells into stayed uneven in Q4, yet results were strong."
origin = "drafted_accepted"

[[claims]]
claim_id = "c9"
quote_ids = ["q11", "q16"]
claim = "Gross margin edged up in Q4 and widened by 180 bp to 48.5% over the full year, with no cause given."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q13"]
claim = "Residential repaint sales rose at a high-single-digit rate in Q4, beating the market, which management credits partly to earlier growth spending."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q14"]
claim = "Sales into new home building rose at a low-single-digit rate in Q4, ahead of that market."
origin = "drafted_accepted"

[[claims]]
claim_id = "c12"
quote_ids = ["q15", "q34"]
claim = "Among Q4 industrial lines, Packaging rose in all regions and by low double digits overall, Coil also grew, and General Industrial fell."
origin = "drafted_accepted"

[[claims]]
claim_id = "c13"
quote_ids = ["q17", "q38"]
claim = "In 2024 the company paid $2.46 billion back to owners in dividends and buybacks, repurchasing 5.2 million shares."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q39"]
claim = "At year end, 34.4 million shares remained under the buyback authorization."
origin = "drafted_accepted"

[[claims]]
claim_id = "c15"
quote_ids = ["q18"]
claim = "Q4 sales rose on the stores segment, while the consumer and coatings segments slipped."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q18", "q32"]
claim = "Exchange rates trimmed Q4 sales by 1.3% for the company as a whole and by 1.7% in coatings."
origin = "drafted_accepted"

[[claims]]
claim_id = "c17"
quote_ids = ["q19"]
claim = "Lower environmental provisions booked at the corporate level helped lift Q4 pretax income."
origin = "drafted_accepted"

[[claims]]
claim_id = "c18"
quote_ids = ["q20", "q28", "q35"]
claim = "Q4 profit comparisons gained because the year-earlier peso devaluation loss did not recur."
origin = "drafted_accepted"

[[claims]]
claim_id = "c19"
quote_ids = ["q20", "q28"]
claim = "Q4 profit comparisons gained because the year-earlier trademark impairment did not recur."
origin = "drafted_accepted"

[[claims]]
claim_id = "c20"
quote_ids = ["q21", "q26", "q31", "q29", "q36"]
claim = "Amortizing the intangibles from the Valspar purchase still weighs on results: $0.19 of Q4 EPS, 230 bp of consumer-segment margin, and 310 bp of coatings margin."
