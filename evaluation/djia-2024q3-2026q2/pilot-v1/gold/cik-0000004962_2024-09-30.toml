[[claims]]
claim_id = "c1"
quote_ids = ["q1"]
claim = "Quarterly profit came to roughly 2.5 billion dollars, or 3.49 per diluted share, against 3.30 per share a year earlier."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q2", "q3"]
claim = "Management lifted its full-year 2024 earnings-per-share forecast to a range of 13.75 to 14.05 dollars, from 13.30 to 13.80."
origin = "drafted_accepted"

[[claims]]
claim_id = "c3"
quote_ids = ["q4"]
claim = "The company still sees revenue rising about 9 percent for the year, inside the range it set at the start of the year."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q5", "q7"]
claim = "Revenue net of interest expense hit a record 16.6 billion dollars for the quarter, 8 percent above last year, the tenth record quarter in a row."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q8"]
claim = "Revenue grew mainly on higher net interest income from larger loan volumes, along with steady growth in card spending and faster card fee growth."
origin = "drafted_accepted"

[[claims]]
claim_id = "c6"
quote_ids = ["q9"]
claim = "Total spending by Card Members grew 6 percent in the quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c7"
quote_ids = ["q9"]
claim = "Growth in card fee revenue sped up to 18 percent in the quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c8"
quote_ids = ["q10"]
claim = "The company added 3.3 million new cards, many of them premium, and kept retention high."
origin = "drafted_accepted"

[[claims]]
claim_id = "c9"
quote_ids = ["q10"]
claim = "Management describes its credit performance as excellent."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q10"]
claim = "Management says it kept up its discipline on expenses."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q12"]
claim = "The company refreshed 40 products worldwide during the year to date, including its updated U.S. Consumer Gold card."
origin = "drafted_edited"

[[claims]]
claim_id = "c12"
quote_ids = ["q11"]
claim = "Management credits its strategy of refreshing products for the momentum and growth in its card portfolio."
origin = "drafted_accepted"

[[claims]]
claim_id = "c13"
quote_ids = ["q13"]
claim = "New dining and other benefits are drawing Millennial and Gen-Z customers, who make up 80 percent of new U.S. Consumer Gold accounts and are the fastest-growing U.S. consumer group."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q14", "q15"]
claim = "The CEO attributes quarterly strength to continued spending on growth and expresses confidence that these investments meet customer needs."
origin = "drafted_edited"

[[claims]]
claim_id = "c15"
quote_ids = ["q16", "q17"]
claim = "Credit loss provisions rose to 1.4 billion dollars from 1.2 billion, as net write-offs grew with loan balances, partly offset by a smaller reserve build than last year."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q18"]
claim = "The net write-off rate was 1.9 percent for the quarter, up from 1.8 percent a year earlier and below the 2.1 percent of the quarter before."
origin = "drafted_accepted"

[[claims]]
claim_id = "c17"
quote_ids = ["q19", "q20"]
claim = "Expenses grew 9 percent to 12.1 billion dollars, mostly from higher customer engagement costs tied to more card spending and travel benefit use, plus more marketing and operating spending."
origin = "drafted_accepted"

[[claims]]
claim_id = "c18"
quote_ids = ["q21"]
claim = "The effective tax rate rose to 21.8 percent from 20.9 percent, because the prior year had one-time tax benefits."
origin = "drafted_accepted"

