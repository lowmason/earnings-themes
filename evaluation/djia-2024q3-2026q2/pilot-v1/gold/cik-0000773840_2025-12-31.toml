[[claims]]
claim_id = "c1"
quote_ids = ["q1"]
claim = "Quarterly revenue rose mainly because customers bought more from the aerospace and buildings units."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q2", "q11"]
claim = "Organic orders grew 23%, led by double-digit aerospace and ESS gains; backlog rose 4% from Q3 to more than $37 billion."
origin = "drafted_edited"

[[claims]]
claim_id = "c3"
quote_ids = ["q11"]
claim = "Part of the order gain came from the LNG business Honeywell bought the year before."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q12"]
claim = "Year-end backlog hit a record above $37B, which management says sets up the coming year."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["aq1"]
claim = "Q4 operating profit fell 35%, and margin declined 6.4 percentage points to 10.2%, largely because PSS/WWS sale classifications prompted impairment and Aerospace incurred a Flexjet charge."
origin = "drafted_edited"

[[claims]]
claim_id = "c6"
quote_ids = ["q4"]
claim = "A one-off charge for the Flexjet lawsuits hit aerospace results and weighed on operating income."
origin = "drafted_accepted"

[[claims]]
claim_id = "c7"
quote_ids = ["q5", "aq1"]
claim = "GAAP EPS fell 72% to $0.49, mostly because of the one-off impairment and litigation charges."
origin = "drafted_edited"

[[claims]]
claim_id = "c8"
quote_ids = ["q6"]
claim = "Adjusted Q4 EPS was $2.59, rising 17% overall but falling 3% without the earlier Bombardier effect. Higher segment profit and fewer shares helped, while a higher effective tax rate offset some of the benefit."
origin = "drafted_edited"

[[claims]]
claim_id = "c9"
quote_ids = ["q6"]
claim = "Fewer shares outstanding helped adjusted EPS grow 17%."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q7"]
claim = "Q4 operating cash fell 38% to $1.2 billion. Free cash on Honeywell’s adjusted measure rose 48% to $2.5 billion, or 13% after excluding the earlier Bombardier effect."
origin = "drafted_edited"

[[claims]]
claim_id = "c11"
quote_ids = ["q9"]
claim = "For 2025, operating cash rose 19% to $6.1 billion; free cash on the company’s adjusted measure rose 20% to $5.1 billion, or 7% without the earlier Bombardier effect."
origin = "drafted_edited"

[[claims]]
claim_id = "c12"
quote_ids = ["q8", "q10"]
claim = "Annual sales rose 8% as reported and 9% after adjustment, with organic growth of 7%, or 6% without Bombardier. Organic growth exceeded the original forecast ceiling by two points; Q4 adjusted sales and EPS also beat earlier targets."
origin = "drafted_edited"

[[claims]]
claim_id = "c13"
quote_ids = ["q13", "q47"]
claim = "Honeywell finished spinning off Solstice Advanced Materials on October 30, 2025."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
