[[claims]]
claim_id = "c1"
quote_ids = ["q1"]
claim = "Same-store sales worldwide rose 3.6% in the quarter, and every segment grew."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q2"]
claim = "Sales across all company and franchised restaurants topped $36 billion, up 8% on a year earlier, or 6% excluding exchange-rate moves."
origin = "drafted_accepted"

[[claims]]
claim_id = "c3"
quote_ids = ["q3"]
claim = "Loyalty-program members spent more than $9 billion in the quarter and about $34 billion over the last four quarters, across 60 markets."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q4"]
claim = "The CEO says the company kept growing sales in every segment despite a difficult operating backdrop."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q5"]
claim = "Management attributes customer visits to affordability, work on the menu and marketing."
origin = "drafted_edited"

[[claims]]
claim_id = "c6"
quote_ids = ["q6", "q7", "q26"]
claim = "U.S. comparable sales rose 2.4%, driven chiefly by a larger average customer bill."
origin = "drafted_edited"

[[claims]]
claim_id = "c7"
quote_ids = ["q8", "q9"]
claim = "Same-store sales in the International Operated segment rose 4.3%, positive in every market, with Germany and Australia leading."
origin = "drafted_accepted"

[[claims]]
claim_id = "c8"
quote_ids = ["q10", "q11"]
claim = "Same-store sales in the licensed developmental markets rose 4.7%, led by Japan, with growth in every region."
origin = "drafted_accepted"

[[claims]]
claim_id = "c9"
quote_ids = ["q12"]
claim = "Total revenue grew 3% in the quarter; at constant exchange rates the gain was only 1%."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q13", "q17"]
claim = "The 2025 modernization program accounted for most of the $39 million in Q3 charges and $148 million over nine months, or $0.04 and $0.16 per share respectively."
origin = "drafted_edited"

[[claims]]
claim_id = "c11"
quote_ids = ["q13", "q14"]
claim = "Q3 operating profit grew 5% as reported and 3% at fixed exchange rates. With specified charges removed from both years, growth was 3% as reported and 1% at fixed exchange rates."
origin = "drafted_edited"

[[claims]]
claim_id = "c12"
quote_ids = ["q18"]
claim = "In Q3 and the first nine months, higher sales lifted franchise margins and adjusted operating profit, partly offset by increased administrative and selling costs."
origin = "drafted_edited"

[[claims]]
claim_id = "c13"
quote_ids = ["q15", "q16"]
claim = "Diluted EPS rose 2% to $3.18; adjusted for charges it was unchanged at $3.22, and down 1% at constant currency."
origin = "drafted_accepted"

[[claims]]
claim_id = "ac1"
quote_ids = ["aq1", "q19"]
claim = "The 2024 comparators included $52 million of Q3 charges and $142 million over nine months, mainly Korean disposal costs and impairments plus Israeli acquisition costs; their per-share effects were $0.05 and $0.15."
origin = "annotator_added"

[[claims]]
claim_id = "ac2"
quote_ids = ["aq1", "q20"]
claim = "For 2024, the organization-modernization charges were $46 million in Q3 and $146 million over nine months, equivalent to $0.05 and $0.15 per share."
origin = "annotator_added"

