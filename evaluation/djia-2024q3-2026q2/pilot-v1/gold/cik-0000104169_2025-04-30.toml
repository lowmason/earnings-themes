[[claims]]
claim_id = "c1"
quote_ids = ["q1", "q2"]
claim = "Total revenue rose 2.5 percent as reported and 4 percent with currency held constant, even though lapping last year's extra leap day cost about a point."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q3", "q4"]
claim = "Operating income grew 4.3 percent, or 3 percent adjusted at constant currency, helped by wider gross margins, more membership fees and better online economics, despite a leap-day drag."
origin = "drafted_accepted"

[[claims]]
claim_id = "c3"
quote_ids = ["q5", "q6", "q7"]
claim = "Online sales across the company rose 22 percent, mostly from orders picked up or delivered from stores and from the third-party marketplace."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q6", "q36"]
claim = "Digital channels took a bigger share of sales in every segment and in the international markets."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q8"]
claim = "Comparable sales at the U.S. stores, excluding fuel, rose 4.5 percent, led by pharmacy and wellness items and by food."
origin = "drafted_accepted"

[[claims]]
claim_id = "c6"
quote_ids = ["q9", "q10"]
claim = "For the coming quarter, management forecasts net sales up 3.5 to 4.5 percent at constant currency."
origin = "drafted_accepted"

[[claims]]
claim_id = "c7"
quote_ids = ["q10", "q11"]
claim = "The full-year fiscal 2026 forecast is left as it was."
origin = "drafted_accepted"

[[claims]]
claim_id = "c9"
quote_ids = ["q45"]
claim = "Management's forecasts do not try to predict fair-value swings in the company's equity investments."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q12"]
claim = "The chief executive credits growth to reaching shoppers and members through more channels."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q13"]
claim = "The chief executive says the company keeps investing for long-run value while staying flexible over the short run."
origin = "drafted_accepted"

[[claims]]
claim_id = "c12"
quote_ids = ["q14"]
claim = "Worldwide advertising activity grew 50 percent, including VIZIO, while Walmart Connect expanded 31 percent in the U.S."
origin = "drafted_edited"

[[claims]]
claim_id = "c13"
quote_ids = ["q15"]
claim = "Membership fee income grew nearly 15 percent, lifting the wider membership and other income line by 3.7 percent."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q16"]
claim = "The company's gross margin rate widened by 12 basis points, mostly from the U.S. stores business."
origin = "drafted_accepted"

[[claims]]
claim_id = "c15"
quote_ids = ["q17"]
claim = "A net loss on equity and other investments cut about five cents from earnings per share, the gap between reported and adjusted EPS."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q18"]
claim = "Return on assets stood at 7.5 percent, and return on investment improved 30 basis points to 15.3 percent."
origin = "drafted_accepted"

[[claims]]
claim_id = "c17"
quote_ids = ["q19"]
claim = "The company raised $4 billion through long-term borrowing at favorable rates for general corporate use."
origin = "drafted_edited"

[[claims]]
claim_id = "c18"
quote_ids = ["q20", "q21"]
claim = "At quarter end the company held $9.3 billion in cash against $52.9 billion of total borrowings."
origin = "drafted_accepted"

[[claims]]
