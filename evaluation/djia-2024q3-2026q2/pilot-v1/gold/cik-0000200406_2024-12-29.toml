[[claims]]
claim_id = "c1"
quote_ids = ["q1"]
claim = "Fourth-quarter sales rose 5.3% to about $22.5 billion, or 6.7% before currency and 5.7% also net of deals."
origin = "drafted_accepted"

[[claims]]
claim_id = "c2"
quote_ids = ["q2"]
claim = "EPS for the quarter was $1.41 as reported and $2.04 adjusted."
origin = "drafted_edited"

[[claims]]
claim_id = "c3"
quote_ids = ["q3"]
claim = "Buying V-Wave brought in-process R&D charges that cut fourth-quarter EPS by 22 cents."
origin = "drafted_accepted"

[[claims]]
claim_id = "c4"
quote_ids = ["q4"]
claim = "Sales for the year grew 4.3% to roughly $88.8 billion, 5.9% at constant currency and 5.4% net of deals."
origin = "drafted_accepted"

[[claims]]
claim_id = "c5"
quote_ids = ["q5"]
claim = "Excluding the COVID-19 vaccine, sales for the year increased 7.0% at constant currency."
origin = "drafted_edited"

[[claims]]
claim_id = "c6"
quote_ids = ["q6"]
claim = "EPS for the year was $5.79 as reported and $9.98 adjusted."
origin = "drafted_edited"

[[claims]]
claim_id = "c7"
quote_ids = ["q7"]
claim = "In-process R&D bought in several deals over the year cut full-year EPS by 67 cents."
origin = "drafted_accepted"

[[claims]]
claim_id = "c8"
quote_ids = ["q8"]
claim = "Pipeline milestones included survival findings for RYBREVANT with LAZCLUZE, the start of a TAR-200 submission, and an IDE approval for the OTTAVA surgical robot."
origin = "drafted_edited"

[[claims]]
claim_id = "c9"
quote_ids = ["q9"]
claim = "For 2025, management projects sales growth excluding the COVID-19 vaccine of 2.5% to 3.5% at constant currency. Adjusted operational EPS is projected at $10.75 to $10.95, up 8.7% at the midpoint."
origin = "drafted_edited"

[[claims]]
claim_id = "c10"
quote_ids = ["q10"]
claim = "The CEO says 2024 brought strong growth."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q10"]
claim = "The CEO says the pipeline is picking up speed."
origin = "drafted_accepted"

[[claims]]
claim_id = "c12"
quote_ids = ["q10"]
claim = "The CEO characterizes the company as an industry leader in investment in innovation."
origin = "drafted_edited"

[[claims]]
claim_id = "c13"
quote_ids = ["q11"]
claim = "The CEO says the company's treatments are raising care standards in serious diseases such as myeloma, lung cancer, bowel disease, and heart failure."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q12"]
claim = "The CEO expects the company's finances, products, and pipeline to keep growth and innovation at a high pace."
origin = "drafted_accepted"

[[claims]]
claim_id = "c15"
quote_ids = ["q13"]
claim = "Innovative Medicine operational sales for the year grew 7.5% without the COVID-19 vaccine."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q14"]
claim = "Innovative Medicine growth came mainly from cancer drugs such as DARZALEX, ERLEADA, and CARVYKTI, from TREMFYA, and from SPRAVATO."
origin = "drafted_accepted"

