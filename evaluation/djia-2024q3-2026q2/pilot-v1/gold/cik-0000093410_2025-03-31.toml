[[claims]]
claim_id = "c01"
quote_ids = ["q01", "q05", "q06"]
claim = "Net income for the quarter dropped to $3.5 billion, or $2.00 a diluted share, from $5.5 billion a year before; on an adjusted basis it was $3.8 billion against $5.4 billion."
origin = "drafted_accepted"

[[claims]]
claim_id = "c02"
quote_ids = ["q02", "q26"]
claim = "The company handed $6.9 billion back to its owners in the quarter: $3.9 billion through buybacks and $3.0 billion through dividends."
origin = "drafted_accepted"

[[claims]]
claim_id = "c03"
quote_ids = ["q03", "q28"]
claim = "Chevron spent $2.2 billion on a 4.99% stake in Hess, a sign it still expects its takeover of Hess to close."
origin = "drafted_accepted"

[[claims]]
claim_id = "c04"
quote_ids = ["q04", "q15", "q29"]
claim = "Ballymore, a deepwater project off the U.S. Gulf coast, began producing in April 2025, on schedule and within budget."
origin = "drafted_accepted"

[[claims]]
claim_id = "c05"
quote_ids = ["q07"]
claim = "Provisions for legal matters were part of a $175 million net loss from special items this quarter."
origin = "drafted_accepted"

[[claims]]
claim_id = "c06"
quote_ids = ["q08"]
claim = "A change to the UK's windfall levy on energy profits led to a one-off tax charge."
origin = "drafted_accepted"

[[claims]]
claim_id = "c07"
quote_ids = ["q09", "q50"]
claim = "Marking its Hess shares to fair value produced a gain that cushioned the quarter's charges and the corporate segment's costs."
origin = "drafted_accepted"

[[claims]]
claim_id = "c08"
quote_ids = ["q10"]
claim = "Exchange-rate movements cut earnings by $138 million."
origin = "drafted_accepted"

[[claims]]
claim_id = "c09"
quote_ids = ["q11"]
claim = "Across the past three years the company paid more than $78 billion back to its stockholders."
origin = "drafted_accepted"

[[claims]]
claim_id = "c10"
quote_ids = ["q12"]
claim = "The chief executive says the company is set up to lead its industry in growth of free cash flow through 2026, even with shifting markets."
origin = "drafted_accepted"

[[claims]]
claim_id = "c11"
quote_ids = ["q13"]
claim = "With its Future Growth Project finished, Tengizchevroil in Kazakhstan brought output up to its design capacity."
origin = "drafted_accepted"

[[claims]]
claim_id = "c12"
quote_ids = ["q14"]
claim = "Permian output rose as operations became more efficient."
origin = "drafted_accepted"

[[claims]]
claim_id = "c13"
quote_ids = ["q16", "q31"]
claim = "The company sold most of its East Texas gas holdings, taking cash plus a capital carry over several years and keeping a royalty interest."
origin = "drafted_accepted"

[[claims]]
claim_id = "c14"
quote_ids = ["q17"]
claim = "Smaller contributions from equity affiliates, both upstream and downstream, were a main reason profit fell from a year earlier."
origin = "drafted_accepted"

[[claims]]
claim_id = "c15"
quote_ids = ["q18"]
claim = "Thinner margins on refined products sold weighed on company-wide profit against the prior year."
origin = "drafted_accepted"

[[claims]]
claim_id = "c16"
quote_ids = ["q19", "q40"]
claim = "Adverse swings in tax items and in exchange rates reduced profit, both company-wide and in international upstream."
origin = "drafted_accepted"

[[claims]]
claim_id = "c17"
quote_ids = ["q20", "q39"]
claim = "Lower realized prices reduced profit company-wide and in international upstream."
origin = "drafted_accepted"

