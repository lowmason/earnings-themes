[project]
name = "earnings-pipeline"
version = "0.1.0"
description = "Earnings pipeline application"
authors = [
    { name = "Lowell Mason", email = "mason.lowell@mac.com" }
]
requires-python = ">=3.14"
dependencies = [
    "earnings-core",
    "earnings-ingestion",
    "earnings-themes",
    "pydantic-settings",             # import pydantic_settings
    "polars",
    "duckdb",
    "pyarrow",
    "typer",
    "rich",
]

[project.scripts]
earnings-pipeline = "earnings_pipeline.cli:app"

[project.optional-dependencies]
orchestration = [
    "langgraph",
]

# Stage 11's live runtime (A2): the local chat adapter and the local NLI and
# tokenizer runtimes, imported only inside model_runtime's builder.
live-models = [
    "earnings-themes[local-model,support-nli]",
]

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
