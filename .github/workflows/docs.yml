name: CI Docs

# Generated by `great-docs setup-github-pages`, then edited for this workspace:
# the root is a virtual uv workspace, so the site builds from the earnings-core
# member (packages/earnings-core/great-docs.yml) with --project-path, and the
# pinned `docs` dependency group supplies great-docs (no separate install).

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history for accurate page timestamps

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.0"

      - name: Install package and dependencies
        run: |
          python -m pip install uv
          uv sync --locked --all-packages

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        run: uv run --locked --no-sync great-docs build --project-path packages/earnings-core </dev/null

      # great-docs exits 0 even when it skips the API reference.
      - name: Check the API reference was built
        run: test -f packages/earnings-core/great-docs/_site/reference/index.html

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: packages/earnings-core/great-docs/_site
          include-hidden-files: true

      - name: How to preview this build locally
        if: github.event_name == 'pull_request'
        run: uv run --locked --no-sync great-docs ci notice --run ${{ github.run_id }} --pr ${{ github.event.number }}

      - name: Upload build timings
        uses: actions/upload-artifact@v7
        with:
          name: build-timings
          path: packages/earnings-core/great-docs/_site/build-timings.json

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
